<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tabs</title>
        <link rel="stylesheet" href="style.css">
        <script src="main.js" defer></script>
    </head>
    <body>
        <div class="tab-buttons">
            <button class="tab-btn active" data-target="tab1">Tab 1</button>
            <button class="tab-btn" data-target="tab2">Tab 2</button>
            <button class="tab-btn" data-target="tab3">Tab 3</button>
            <button class="tab-btn" data-target="tab4">Tab 4</button>
        </div>
        <div class="tab-containers">
            <div class="tab-content active" data-target="tab1" id="tab1">
                <h2>Tabs 1</h2>
                <p>Content for Tab 1</p>
            </div>
            <div class="tab-content" data-target="tab2" id="tab2">
                <h2>Tabs 2</h2>
                <p>Content for Tab 2</p>
            </div>
            <div class="tab-content" data-target="tab3" id="tab3">
                <h2>Tabs 3</h2>
                <p>Content for Tab 3</p>
            </div>
            <div class="tab-content" data-target="tab4" id="tab4">
                <h2>Tabs 4</h2>
                <p>Content for Tab 4</p>
            </div>
        </div>
    </body>
</html>
